apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release signing lives outside the repo. keystore.properties (gitignored) names storeFile,
// storePassword, keyAlias and keyPassword; without it release builds come out unsigned, which
// is what F-Droid expects before comparing against the published APK.
def releaseSigningFile = rootProject.file("keystore.properties")
def releaseSigning = new Properties()
if (releaseSigningFile.exists()) releaseSigningFile.withInputStream { releaseSigning.load(it) }

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "io.github.xer0z_gh.moo"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0.0"

        resourceConfigurations += ["en", "ar", "cs", "da", "de", "el", "es-rES", "es-rUS", "fi", "fr", "he", "hi", "hr", "hu", "in", "it", "ja", "ko", "nb", "nl", "pl", "pt-rBR", "ro", "ru-rRU", "sv", "th", "tr", "uk", "vi", "zh"]
        testInstrumentationRunner "app.olauncher.MemoryInstrumentation"
    }

    signingConfigs {
        if (releaseSigningFile.exists()) {
            release {
                storeFile file(releaseSigning["storeFile"])
                storePassword releaseSigning["storePassword"]
                keyAlias releaseSigning["keyAlias"]
                keyPassword releaseSigning["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            if (releaseSigningFile.exists()) signingConfig signingConfigs.release
            // Reproducible builds: F-Droid publishes the developer-signed APK only if its own
            // rebuild matches byte for byte, and embedded git state never does.
            vcsInfo.include false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Release code (R8, ART profiles) under the debug key and a .debug suffix, so it installs
        // beside a store copy and never needs the release key.
        daily {
            initWith release
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions += "store"
    productFlavors {
        // Google Play: colour themes and the visualizer unlock when the paid Moo Pro key app (:prokey)
        // is installed. No billing library is linked, so the GPL code stays free of proprietary code.
        play { dimension "store" }
        // GitHub, F-Droid and other stores: no proprietary library, and every feature included.
        foss { dimension "store" }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    // Stored, not deflated: a compressed font cannot be memory-mapped, so choosing Inter made
    // every process start inflate a private ~0.9 MB copy on the main thread. Stored, it is
    // mapped as clean pages the kernel can drop. Costs ~420 KB of APK; only Inter users gain.
    androidResources {
        noCompress += 'ttf'
    }
    namespace 'app.olauncher'
}

dependencies {
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle. lifecycle-extensions (deprecated since 2020) was dropped: nothing used it.
    // lifecycle-process still arrives through appcompat -> emoji2; its start-up initializer is
    // removed in the manifest instead.
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    // Work Manager - initialized on demand by MooApplication, not at every process start.
    implementation libs.work.runtime.ktx

    // com.google.android.material was dropped: no Material widget, theme or attribute is used, and
    // R8 was still keeping 279 of its classes.

    // Material's own dependencies had been lifting these to the versions below. Without it, Gradle
    // resolved OLDER ones (drawerlayout 1.0.0, activity-ktx 1.7.2, transition 1.4.1) - found by
    // diffing the full resolved classpath with and without Material. Pinned to what the app
    // already shipped with, so dropping Material changes no library the app runs on.
    constraints {
        implementation('androidx.drawerlayout:drawerlayout:1.1.1')
        implementation('androidx.activity:activity-ktx:1.8.0')
        implementation('androidx.transition:transition:1.5.0')
    }

    testImplementation libs.junit
}
